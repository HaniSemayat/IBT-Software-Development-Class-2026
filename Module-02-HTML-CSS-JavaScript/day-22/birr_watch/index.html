<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birr Watch App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="app">

        <h1>Birr Watch</h1>
        <p id="status">Loading rates...</p>
        
        <form id="convert-form">
            <input 
                id="amount" 
                type="number" 
                value="100"
            >
            <select id="currency"></select>
            <button>Convert</button>     
        </form>

        <p id="result"></p>
        
        <h2>Watchlist</h2>

        <ul id="watchlist"></ul>

        <button id="add-watchlist">
            Add to watchlist
        </button>

    </main>

    <script src="app.js"></script>

</body>
</html>
