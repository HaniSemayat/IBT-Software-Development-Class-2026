<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Addis Market Shopping List</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>Addis Market</h1>
        <p>Shopping List</p>
    </header>


    <main>

        <!-- Add item form -->
        <form id="add-form">

            <label for="name">Item name</label>
            <input
                type="text"
                id="name"
                placeholder="e.g. Injera"
            >

            <label for="price">Price (ETB)</label>
            <input
                type="number"
                id="price"
                placeholder="e.g. 50"
                min="1"
            >

            <button type="submit">Add Item</button>

        </form>


        <!-- Shopping list -->
        <section>

            <h2>Shopping List</h2>

            <ul id="list">
                <!-- JavaScript will add items here -->
            </ul>

        </section>


        <!-- Running total -->
        <section>

            <h2>Total</h2>

            <p>
                Total: <span id="total">0</span> ETB
            </p>

        </section>

    </main>


    <script src="app.js"></script>

</body>

</html>
